{% extends 'movies/base.html' %}
{% block title %}Rejestracja{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card p-4 shadow-lg" style="background-color: var(--bg-card); border-radius: 16px;">
            <h2 class="text-center mb-4"><i class="bi bi-person-plus-fill me-2"></i>Utwórz konto</h2>
            <form method="post">
                {% csrf_token %}
                {% for field in form %}
                    <div class="mb-3">
                        <label class="form-label">{{ field.label }}</label>
                        {{ field }}
                        {% if field.errors %}
                            <div class="text-danger small mt-1">{{ field.errors|striptags }}</div>
                        {% endif %}
                    </div>
                {% endfor %}
                <button type="submit" class="btn btn-primary w-100">Zarejestruj się</button>
            </form>
            <p class="text-center mt-3 mb-0">Masz już konto? <a href="{% url 'login' %}" class="text-decoration-none" style="color: var(--accent);">Zaloguj się</a></p>
        </div>
    </div>
</div>
{% endblock %}
