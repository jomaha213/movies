{% extends 'movies/base.html' %}
{% block title %}Edycja profilu{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card p-4 shadow-lg" style="background-color: var(--bg-card); border-radius: 16px;">
            <h2 class="mb-4"><i class="bi bi-gear-fill me-2"></i>Ustawienia profilu</h2>
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                <fieldset class="mb-3">
                    <legend class="h5">Dane podstawowe</legend>
                    {% for field in u_form %}
                        <div class="mb-3">
                            <label class="form-label">{{ field.label }}</label>
                            {{ field }}
                        </div>
                    {% endfor %}
                </fieldset>
                <fieldset class="mb-3">
                    <legend class="h5">Profil rozszerzony</legend>
                    {% for field in p_form %}
                        <div class="mb-3">
                            <label class="form-label">{{ field.label }}</label>
                            {{ field }}
                        </div>
                    {% endfor %}
                </fieldset>
                <button type="submit" class="btn btn-primary w-100">Zapisz zmiany</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
